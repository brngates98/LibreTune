name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check-linux:
    name: Rust Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  rust-check-windows:
    name: Rust Check & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  rust-check-macos:
    name: Rust Check & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/libretune-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  build-test-linux:
    name: Build Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/libretune-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Tauri CLI
        uses: tauri-apps/tauri-action@v0
        with:
          tauri-version: 2
          project-path: crates/libretune-app

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Tauri build
        run: npm run tauri build -- --debug

  build-test-windows:
    name: Build Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/libretune-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Tauri CLI
        uses: tauri-apps/tauri-action@v0
        with:
          tauri-version: 2
          project-path: crates/libretune-app

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Tauri build
        run: npm run tauri build -- --debug

  build-test-macos:
    name: Build Test (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/libretune-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Tauri CLI
        uses: tauri-apps/tauri-action@v0
        with:
          tauri-version: 2
          project-path: crates/libretune-app

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Tauri build
        run: npm run tauri build -- --debug

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
