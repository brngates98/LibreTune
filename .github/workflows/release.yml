name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Build frontend
        working-directory: crates/libretune-app
        run: npm run build

      - name: Build Tauri app (Linux)
        working-directory: crates/libretune-app
        run: npm run tauri build

      - name: Create releases directory
        run: mkdir -p releases

      - name: Copy Linux artifacts
        run: |
          mkdir -p releases/linux
          cp -r crates/libretune-app/src-tauri/target/release/bundle/deb/*.deb releases/linux/ 2>/dev/null || true
          cp -r crates/libretune-app/src-tauri/target/release/bundle/appimage/*.AppImage releases/linux/ 2>/dev/null || true
          cp -r crates/libretune-app/src-tauri/target/release/libretune-app releases/linux/ 2>/dev/null || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: releases/linux/*
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Build frontend
        working-directory: crates/libretune-app
        run: npm run build

      - name: Build Tauri app (Windows)
        working-directory: crates/libretune-app
        run: npm run tauri build

      - name: Create releases directory
        run: mkdir releases

      - name: Copy Windows artifacts
        run: |
          mkdir releases\windows
          xcopy /E /I /Y crates\libretune-app\src-tauri\target\release\bundle\msi\*.msi releases\windows\ 2>nul || echo No MSI found
          xcopy /E /I /Y crates\libretune-app\src-tauri\target\release\bundle\nsis\*.exe releases\windows\ 2>nul || echo No NSIS found
          copy /Y crates\libretune-app\src-tauri\target\release\libretune-app.exe releases\windows\ 2>nul || echo No EXE found

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: releases/windows/*
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Build frontend
        working-directory: crates/libretune-app
        run: npm run build

      - name: Build Tauri app (macOS)
        working-directory: crates/libretune-app
        run: npm run tauri build

      - name: Create releases directory
        run: mkdir -p releases

      - name: Copy macOS artifacts
        run: |
          mkdir -p releases/macos
          cp -r crates/libretune-app/src-tauri/target/release/bundle/dmg/*.dmg releases/macos/ 2>/dev/null || true
          cp -r crates/libretune-app/src-tauri/target/release/bundle/macos/*.app releases/macos/ 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: releases/macos/*
          if-no-files-found: warn

  collect-artifacts:
    name: Collect All Artifacts
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases

      - name: List all artifacts
        run: |
          echo "## Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find releases -type f -exec ls -lh {} \; | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All release artifacts have been collected in the \`releases\` directory."

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms-release
          path: releases
          retention-days: 30

