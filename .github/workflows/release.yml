name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release Binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux-x86_64'
            os: ubuntu-latest
            args: ''
          - platform: 'windows-x86_64'
            os: windows-latest
            args: ''
          - platform: 'macos-aarch64'
            os: macos-latest
            args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/libretune-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Tauri CLI
        uses: tauri-apps/tauri-action@v0
        with:
          tauri-version: 2
          project-path: crates/libretune-app

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tauri-version: 2
          project-path: crates/libretune-app
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binaries
          path: |
            crates/libretune-app/src-tauri/target/**/*.deb
            crates/libretune-app/src-tauri/target/**/*.AppImage
            crates/libretune-app/src-tauri/target/**/*.dmg
            crates/libretune-app/src-tauri/target/**/*.msi
            crates/libretune-app/src-tauri/target/**/*.exe
            crates/libretune-app/src-tauri/target/**/*.zip
          retention-days: 30
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release notes
        id: release_notes
        run: |
          # Extract version from tag (remove 'v' prefix if present)
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION#refs/tags/}
          
          # Get changelog entries if CHANGELOG.md exists
          if [ -f CHANGELOG.md ]; then
            # Try to extract version section from CHANGELOG.md
            NOTES=$(awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md | head -n -1 || echo "Release $VERSION")
          else
            NOTES="Release $VERSION"
          fi
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LibreTune ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

